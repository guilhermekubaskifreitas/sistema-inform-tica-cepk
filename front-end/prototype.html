<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prototipo API CEPK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --navy-950: #071a33;
        --navy-900: #0a2540;
        --navy-800: #0e3157;
        --blue-600: #1d4ed8;
        --blue-500: #2563eb;
        --blue-100: #dbeafe;
        --cyan-400: #38bdf8;
        --green-500: #16a34a;
        --green-100: #dcfce7;
        --amber-500: #d97706;
        --amber-100: #fef3c7;
        --red-600: #dc2626;
        --red-100: #fee2e2;
        --ink-900: #0f172a;
        --ink-700: #334155;
        --ink-500: #64748b;
        --ink-400: #94a3b8;
        --line: #e2e8f0;
        --surface: #ffffff;
        --bg: #f1f5f9;
        --radius: 16px;
        --shadow-lg: 0 24px 60px -20px rgba(8, 25, 51, 0.35);
        --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; min-height: 100%; }

      body {
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink-900);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 20px;
        -webkit-font-smoothing: antialiased;
        min-height: 100%;
      }

      h1 {
        font-size: 24px;
        color: var(--navy-800);
        margin: 0 0 16px;
        letter-spacing: -0.01em;
      }

      h2 {
        font-size: 15px;
        color: var(--ink-500);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin: 24px 0 8px;
      }

      .card {
        width: 100%;
        max-width: 520px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
        padding: 28px;
      }

      .subtitle {
        color: var(--ink-500);
        font-size: 13px;
        margin-top: 0;
      }

      .field { margin-bottom: 18px; position: relative; }

      label {
        display: block;
        font-weight: 600;
        color: var(--ink-700);
        font-size: 13px;
        margin-bottom: 6px;
      }

      input[type="text"], input[type="email"], input[type="password"], select, textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        font: inherit;
        color: inherit;
      }

      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--blue-600);
        box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15);
      }

      button {
        cursor: pointer;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink-700);
        font-weight: 600;
        padding: 12px 18px;
        font-size: 14px;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
      }

      button.secondary {
        background: var(--surface);
        color: var(--ink-700);
        border: 1px solid var(--line);
        padding: 10px 14px;
      }

      button.secondary:hover { background: #f8fafc; border-color: #cbd5e1; }

      #registerBtn {
        margin-top: 6px;
        background: linear-gradient(180deg, var(--blue-500), var(--blue-600));
        border: 0;
        color: #fff;
        font-weight: 700;
      }

      #registerBtn:hover {
        background: linear-gradient(180deg, #3b82f6, #1d4ed8);
      }

      .message {
        background: #f8fafc;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px 14px;
        font-size: 13.5px;
        line-height: 1.6;
        min-height: 18px;
        margin-top: 10px;
      }

      .error {
        background: var(--red-100);
        border: 1px solid #fecaca;
        color: var(--red-600);
        padding: 12px 14px;
        border-radius: var(--radius);
        font-size: 13.5px;
        line-height: 1.6;
        min-height: 18px;
      }

      .success {
        background: var(--green-100);
        border: 1px solid #bbf7d0;
        color: var(--green-500);
        padding: 12px 14px;
        border-radius: var(--radius);
        font-size: 13.5px;
        line-height: 1.6;
        min-height: 18px;
      }

      textarea { resize: vertical; min-height: 64px; }

      select#subjects { padding: 10px 12px; }
      select#subjects option { padding: 8px 10px; }
      select#subjects option:checked { background: #dbeafe; }

      pre.debug {
        font-family: Consolas, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        max-height: 340px;
        overflow: auto;
        background: #f8fafc;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px;
        margin-top: 4px;
      }

      .link-note { font-size: 13px; color: var(--ink-500); margin-top: 6px; }

      @media (max-width: 560px) {
        .card { padding: 20px 16px; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Prototipo API CEPK</h1>
      <p class="subtitle">
        Testa: cadastro → página de aprovação com botões Aprovar / Recusar → login.
        Use <code>?api=http://localhost:3000</code> para apontar para a API local.
      </p>

      <div class="field">
        <label for="name">Nome</label>
        <input type="text" id="name" placeholder="Seu nome completo" maxlength="120">
      </div>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="exemplo@escola.pr.gov.br">
      </div>
      <div class="field">
        <label for="password">Senha (pelo menos 8 caracteres)</label>
        <input type="password" id="password" placeholder="senha123">
      </div>
      <div class="field">
        <label for="subjects">Disciplinas (pelo menos uma)</label>
        <select id="subjects" multiple size="8">
          <option value="Matemática">Matemática</option>
          <option value="Português">Português</option>
          <option value="Química">Química</option>
          <option value="Biologia">Biologia</option>
          <option value="Geografia">Geografia</option>
          <option value="Física">Física</option>
          <option value="História">História</option>
          <option value="Educação Física">Educação Física</option>
          <option value="Inglês">Inglês</option>
          <option value="Arte">Arte</option>
          <option value="Banco de Dados">Banco de Dados</option>
          <option value="Introdução à Computação">Introdução à Computação</option>
          <option value="Introdução à Programação">Introdução à Programação</option>
          <option value="Lógica Computacional">Lógica Computacional</option>
          <option value="Análise e Métodos para Sistema">Análise e Métodos para Sistema</option>
          <option value="Projeto/Outro">Projeto/Outro</option>
        </select>
      </div>

      <button id="registerBtn" type="button">Registrar e aguardar aprovação</button>
      <div id="errors"></div>
      <div id="result"></div>

      <h2>Página de aprovação (direto do backend)</h2>
      <div class="field">
        <label for="approvalLink">Link de aprovação dos botões do e-mail:</label>
        <textarea id="approvalLink" rows="1" readonly placeholder="Insira o link recebido ou clique em Gerar link abaixo"></textarea>
        <div class="link-note"><button class="secondary" id="generateLinkBtn" type="button">Gerar link de aprovação</button></div>
      </div>

      <h2>Log de testes</h2>
      <pre id="debug" class="debug">Carregado.</pre>
      <div class="message"><button class="secondary" id="clearLogBtn" type="button">Limpar registros</button></div>
    </main>

    <script src="api.js?v=20261111e"></script>
    <script>
      const LOG_KEY = "cepk_prova_logs";

      const errorsEl = document.getElementById("errors");
      const resultEl = document.getElementById("result");
      const debugEl = document.getElementById("debug");

      let logs = [];

      function renderLogs() {
        debugEl.textContent = logs
          .map((entry) => `${entry.time}\n  - ${entry.title}${entry.detail ? ": " + entry.detail : ""}`)
          .join("\n");
      }

      function appendLog(entry) {
        logs.push(Object.assign({ time: new Date().toISOString() }, entry));
        if (logs.length > 100) logs.shift();
        localStorage.setItem(LOG_KEY, JSON.stringify(logs));
        renderLogs();
      }

      function showResult(message) {
        errorsEl.innerHTML = "";
        errorsEl.style.display = "none";
        resultEl.className = "message";
        resultEl.textContent = message || "";
      }

      function showError(message) {
        showResult("");
        errorsEl.style.display = "block";
        errorsEl.className = "error";
        errorsEl.textContent = message || "";
      }

      document.getElementById("clearLogBtn").addEventListener("click", () => {
        localStorage.removeItem(LOG_KEY);
        logs = [];
        renderLogs();
        showResult("Registros limpos.");
      });

      document.getElementById("generateLinkBtn").addEventListener("click", () => {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const token = localStorage.getItem("cepk_prova_token");
        if (!token) { showResult("Nenhum link gerado ainda. Registre primeiro."); return; }
        if (!name || !email) { showResult("Preencha nome e e-mail antes de gerar o link."); return; }
        const link = window.CEPKApi.approvalUrl(token, "approve");
        document.getElementById("approvalLink").value = link;
        window.location.href = link;
      });

      document.getElementById("registerBtn").addEventListener("click", async () => {
        const data = {
          name: document.getElementById("name").value.trim(),
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
          subjects: Array.from(document.getElementById("subjects").selectedOptions).map((o) => o.value),
        };
        const result = await window.CEPKApi.register(data);
        if (!result.ok) {
          showError(window.CEPKApi.errorMessage(result, `Registro recusado (HTTP ${result.status}).`));
          return;
        }
        const payload = result.data || {};
        if (payload.token) {
          localStorage.setItem("cepk_prova_token", payload.token);
          document.getElementById("approvalLink").value = window.CEPKApi.approvalUrl(payload.token, "approve");
        }
        appendLog({ type: "cadastro", title: "Cadastro registrado", detail: `status=${payload.user.status} emailSent=${payload.emailSent}` });
        showResult(`Cadastro registrado. Status: ${payload.user.status}.`);
      });

      renderLogs();
    </script>
  </body>
</html>
