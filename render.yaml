# Render Blueprint — Sistema de Agendamento dos Laboratórios CEPK
# Frontend: Static Site | API: Web Service
# Banco de dados: Neon (externo) — variável DATABASE_URL configurada no dashboard, nunca no repo

services:
  # ---------------------------------------------------------------------------
  # API (Node.js Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: backend-informatica-cepk
    runtime: node
    plan: free
    rootDir: back-end
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Cole a connection string do Neon no dashboard (Environment), nunca aqui
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
      - key: APP_URL
        sync: false
      - key: RESERVATION_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: onboarding@resend.dev
      - key: USE_FORMSUBMIT
        value: "false"

  # ---------------------------------------------------------------------------
  # Frontend (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: frontend-sistema-cepk
    runtime: static
    staticPublishPath: ./front-end
    autoDeployTrigger: commit
    previews:
      generation: automatic
