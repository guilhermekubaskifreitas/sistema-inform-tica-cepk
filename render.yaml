services:
  # API real (Node + Express + Prisma) -> grava no Neon.
  # O front-end e o mock sao gerenciados manualmente no painel do Render,
  # por isso nao entram aqui (evita criar servicos duplicados a cada apply).
  - type: web
    name: cepk-api-96uq
    runtime: node
    plan: free
    rootDir: back-end
    buildCommand: npm install --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run prisma:deploy && npm run start:api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: APP_URL
        value: https://frontend-informatica-cepk.onrender.com
      - key: API_PUBLIC_URL
        value: https://cepk-api.onrender.com
      - key: CORS_ORIGIN
        value: https://frontend-informatica-cepk.onrender.com,http://localhost:5500,http://127.0.0.1:5500
      - key: ALLOWED_EMAIL_DOMAINS
        value: escola.pr.gov.br,gmail.com
      - key: APPROVAL_EMAIL
        value: guilhermekf55@gmail.com
      - key: RESERVATION_EMAIL
        value: guilhermekf55@gmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: onboarding@resend.dev
      - key: ADMIN_NAME
        value: Secretaria CEPK
      - key: ADMIN_EMAIL
        value: guilhermekf55@gmail.com
      - key: ADMIN_PASSWORD
        sync: false